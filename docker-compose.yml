services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: compliance-qdrant
    ports:
      - "6333:6333"   # REST / HTTP  (qdrant-client default)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage   # persists collections across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
